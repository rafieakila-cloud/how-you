<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>How You — Career Fortune</title>
<meta name="description" content="Enter your name and age — find your predicted career, aura, and destiny. Instant, free, offline.">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stars"></div>
  <main class="card">
    <div class="brand">
      <img src="icons/icon.svg" alt="How You" class="logo">
      <h1>How You<span>?</span></h1>
      <p class="tag">Find your true career in seconds · offline</p>
    </div>

    <form id="form">
      <label>Your name</label>
      <input id="name" type="text" placeholder="e.g. Farhat Rafie" required autocomplete="name">
      <label>Your age</label>
      <input id="age" type="number" min="5" max="100" placeholder="22" required>
      <button type="submit" id="revealBtn">Reveal my destiny →</button>
    </form>

    <div id="result" class="hidden">
      <div class="ribbon">YOUR DESTINY</div>
      <div class="headline">
        <div>
          <div class="label">Predicted Career</div>
          <div class="title" id="job">—</div>
        </div>
        <div>
          <div class="label">Your Aura</div>
          <div class="title small" id="aura">—</div>
        </div>
      </div>
      <div class="grid2">
        <div class="mini"><div class="label">Future title</div><div class="value" id="futureTitle">—</div></div>
        <div class="mini"><div class="label">Lucky item</div><div class="value" id="item">—</div></div>
        <div class="mini"><div class="label">Work-life balance</div><div class="value" id="balance">—</div></div>
        <div class="mini"><div class="label">Tomorrow's vibe</div><div class="value" id="vibe">—</div></div>
      </div>
      <p id="fortune" class="fortune">—</p>
      <div class="actions">
        <button id="againBtn" class="btn btn-primary">Try another</button>
        <button id="copyBtn" class="btn btn-ghost">Copy result</button>
      </div>
    </div>
  </main>

<script src="app.js"></script>
</body>
</html>
